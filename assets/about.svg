<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none">

<style>
  .sans { font-family: 'Inter Display','Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; }
  .mono { font-family: 'JetBrains Mono','SF Mono','Cascadia Code',Consolas,'DejaVu Sans Mono',Menlo,monospace; }
</style>
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" stroke="#151A24" stroke-width="1"/>
  </pattern>
  <radialGradient id="fade" cx="70%" cy="20%" r="80%">
    <stop offset="0" stop-color="#fff" stop-opacity="1"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <mask id="gridmask"><rect width="1200" height="360" fill="url(#fade)"/></mask>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#D4FF3A" stop-opacity="0.20"/>
    <stop offset="1" stop-color="#D4FF3A" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="card"><rect width="1200" height="360" rx="20"/></clipPath>
  
</defs>
<g clip-path="url(#card)">
  <rect width="1200" height="360" fill="#0B0D12"/>
  <rect width="1200" height="360" fill="url(#grid)" mask="url(#gridmask)" opacity=".6"/>
<text class="sans" x="60" y="84" font-size="29" font-weight="600" letter-spacing="-0.6" fill="#F2F4F8">I build products end to end —</text>
<text class="sans" x="60" y="124" font-size="29" font-weight="600" letter-spacing="-0.6" fill="#C9CEDA">from database schema and APIs</text>
<text class="sans" x="60" y="164" font-size="29" font-weight="600" letter-spacing="-0.6" fill="#C9CEDA">to the interfaces people use every day.</text>
<text class="sans" x="60" y="222" font-size="16.5" fill="#8B93A7">I design REST APIs with Node.js and NestJS, model data across</text>
<text class="sans" x="60" y="249" font-size="16.5" fill="#8B93A7">SQL and NoSQL, and ship web and mobile front ends with Next.js</text>
<text class="sans" x="60" y="276" font-size="16.5" fill="#8B93A7">and React Native. I care about clean architecture, readable</text>
<text class="sans" x="60" y="303" font-size="16.5" fill="#8B93A7">code and software that holds up in production.</text>
<line x1="720" y1="48" x2="720" y2="312" stroke="#1C2130"/>
<text class="mono" x="760" y="82" font-size="11.5" letter-spacing="1.8" fill="#5A6275">ROLE</text>
<text class="sans" x="1140" y="83" font-size="16" font-weight="500" fill="#F2F4F8" text-anchor="end">Full Stack Developer</text>
<line x1="760" y1="108" x2="1140" y2="108" stroke="#1C2130" stroke-dasharray="2 4"/>
<text class="mono" x="760" y="134" font-size="11.5" letter-spacing="1.8" fill="#5A6275">BASED IN</text>
<text class="sans" x="1140" y="135" font-size="16" font-weight="500" fill="#F2F4F8" text-anchor="end">Kerala, India</text>
<line x1="760" y1="160" x2="1140" y2="160" stroke="#1C2130" stroke-dasharray="2 4"/>
<text class="mono" x="760" y="186" font-size="11.5" letter-spacing="1.8" fill="#5A6275">FOCUS</text>
<text class="sans" x="1140" y="187" font-size="16" font-weight="500" fill="#F2F4F8" text-anchor="end">APIs · Marketplaces · Mobile</text>
<line x1="760" y1="212" x2="1140" y2="212" stroke="#1C2130" stroke-dasharray="2 4"/>
<text class="mono" x="760" y="238" font-size="11.5" letter-spacing="1.8" fill="#5A6275">AI WORKFLOW</text>
<text class="sans" x="1140" y="239" font-size="16" font-weight="500" fill="#F2F4F8" text-anchor="end">Claude · Cursor · Codex</text>
<line x1="760" y1="264" x2="1140" y2="264" stroke="#1C2130" stroke-dasharray="2 4"/>
<text class="mono" x="760" y="290" font-size="11.5" letter-spacing="1.8" fill="#5A6275">STATUS</text>
<circle cx="965" cy="285" r="4" fill="#D4FF3A"/>
<text class="sans" x="1140" y="291" font-size="16" font-weight="500" fill="#D4FF3A" text-anchor="end">Open for freelance</text>
</g>
<rect x="0.5" y="0.5" width="1199" height="359" rx="19.5" stroke="#1C2130"/>
</svg>