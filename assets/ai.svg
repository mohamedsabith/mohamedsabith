<text class="sans" x="60" y="256" font-size="16.5" fill="#8B93A7">agents draft, refactor and test; I design the architecture,</text>
<text class="sans" x="60" y="282" font-size="16.5" fill="#8B93A7">review every change and own what ships to production.</text>
