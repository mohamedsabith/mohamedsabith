<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" fill="none">

<style>
  .sans { font-family: 'Inter Display','Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; }
  .mono { font-family: 'JetBrains Mono','SF Mono','Cascadia Code',Consolas,'DejaVu Sans Mono',Menlo,monospace; }
</style>
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" stroke="#151A24" stroke-width="1"/>
  </pattern>
  <radialGradient id="fade" cx="70%" cy="20%" r="80%">
    <stop offset="0" stop-color="#fff" stop-opacity="1"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <mask id="gridmask"><rect width="1200" height="450" fill="url(#fade)"/></mask>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#D4FF3A" stop-opacity="0.20"/>
    <stop offset="1" stop-color="#D4FF3A" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="card"><rect width="1200" height="450" rx="20"/></clipPath>
  
</defs>
<g clip-path="url(#card)">
  <rect width="1200" height="450" fill="#0B0D12"/>
  
  <style>
    .spin { animation: spin 40s linear infinite; transform-origin: 935px 222px; }
    .spinr { animation: spin 60s linear infinite reverse; transform-origin: 935px 222px; }
    .sweep { animation: spin 6s linear infinite; transform-origin: 935px 222px; }
    @keyframes spin { to { transform: rotate(360deg) } }
    .flow { animation: flow 1.2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset:-20 } }
    .breathe { animation: breathe 3s ease-in-out infinite; transform-origin: 935px 222px; }
    @keyframes breathe { 0%,100% { transform: scale(1); opacity:.5 } 50% { transform: scale(1.18); opacity:0 } }
    .tw { animation: tw 3s ease-in-out infinite; }
    @keyframes tw { 0%,100% { opacity:.15 } 50% { opacity:.9 } }
  </style>
  <defs>
    <linearGradient id="aig" x1="60" x2="520" y1="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D4FF3A"/><stop offset="1" stop-color="#5EEAD4"/>
    </linearGradient>
    <radialGradient id="aiglow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#5EEAD4" stop-opacity=".16"/><stop offset=".6" stop-color="#D4FF3A" stop-opacity=".05"/><stop offset="1" stop-color="#D4FF3A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sw" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#5EEAD4" stop-opacity="0"/><stop offset="1" stop-color="#5EEAD4" stop-opacity=".22"/>
    </linearGradient>
