<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" fill="none">

<style>
  .sans { font-family: 'Inter Display','Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; }
  .mono { font-family: 'JetBrains Mono','SF Mono','Cascadia Code',Consolas,'DejaVu Sans Mono',Menlo,monospace; }
</style>
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" stroke="#151A24" stroke-width="1"/>
  </pattern>
  <radialGradient id="fade" cx="70%" cy="20%" r="80%">
    <stop offset="0" stop-color="#fff" stop-opacity="1"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <mask id="gridmask"><rect width="1200" height="470" fill="url(#fade)"/></mask>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#D4FF3A" stop-opacity="0.20"/>
    <stop offset="1" stop-color="#D4FF3A" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="card"><rect width="1200" height="470" rx="20"/></clipPath>
  
</defs>
<g clip-path="url(#card)">
  <rect width="1200" height="470" fill="#0B0D12"/>
  
  <style>
    .rise { opacity:0; animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards; }
    .d1 { animation-delay:.10s } .d2 { animation-delay:.25s } .d3 { animation-delay:.45s } .d4 { animation-delay:.65s } .d5 { animation-delay:.85s }
    @keyframes rise { from { opacity:0; transform:translateY(14px) } to { opacity:1; transform:none } }
    .flow { animation: flow 1.2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset:-24 } }
    .type { animation: type 3.2s steps(50) 1.1s forwards; }
    @keyframes type { from { width:0 } to { width:510px } }
    .caret { animation: blink 1s steps(1) infinite; }
    .caretmove { animation: caretmove 3.2s steps(50) 1.1s forwards; }
    @keyframes caretmove { from { transform:translateX(0) } to { transform:translateX(510px) } }
    @keyframes blink { 50% { opacity:0 } }
    .pulse { animation: pulse 2s ease-out infinite; transform-origin: 66px 410px; }
    @keyframes pulse { 0% { transform:scale(1); opacity:.6 } 100% { transform:scale(3.2); opacity:0 } }
  </style>
  <rect width="1200" height="470" fill="url(#grid)" mask="url(#gridmask)"/>
  <circle cx="1000" cy="200" r="320" fill="url(#glow)"/>

  <g class="rise d1">
    <text class="mono" x="60" y="66" font-size="13" letter-spacing="2" fill="#5A6275">~/MOHAMEDSABITH</text>
    <text class="mono" x="1140" y="66" font-size="13" letter-spacing="2" fill="#5A6275" text-anchor="end">KERALA, IN · UTC+05:30</text>
    <line x1="60" y1="86" x2="1140" y2="86" stroke="#1C2130"/>
  </g>

  <g class="rise d2">
    <text class="sans" x="56" y="196" font-size="104" font-weight="800" letter-spacing="-4" fill="#F2F4F8">Mohamed</text>
    <text class="sans" x="56" y="292" font-size="104" font-weight="800" letter-spacing="-4" fill="#F2F4F8">Sabith<tspan fill="#D4FF3A">.</tspan></text>
  </g>

  <g class="rise d3">
    <text class="sans" x="60" y="338" font-size="24" font-weight="600" fill="#F2F4F8">Full Stack Developer<tspan fill="#8B93A7" font-weight="400"> — web &amp; mobile, end to end.</tspan></text>
  </g>

  <g class="rise d4">
    <text class="mono" x="60" y="378" font-size="17" fill="#D4FF3A">❯</text>
    <clipPath id="typeclip"><rect class="type" x="84" y="358" width="0" height="28"/></clipPath>
    <text class="mono" x="84" y="378" font-size="17" fill="#C9CEDA" clip-path="url(#typeclip)">node · nestjs · next.js · react native · ai agents</text>
    <g class="caretmove"><rect class="caret" x="86" y="363" width="9" height="19" fill="#D4FF3A"/></g>
  </g>

  <g class="rise d5">
    <circle class="pulse" cx="66" cy="410" r="5" fill="#D4FF3A"/>
    <circle cx="66" cy="410" r="5" fill="#D4FF3A"/>
    <text class="mono" x="82" y="415" font-size="13" letter-spacing="1.5" fill="#8B93A7">OPEN FOR FREELANCE PROJECTS</text>
  </g>

  <g class="rise d4">
    <text class="mono" x="760" y="378" font-size="12" letter-spacing="1.5" fill="#5A6275">// HOW I BUILD — CLIENT → API → DATA + AI</text>
    <path id="e1" d="M900 150.0 C920.0 150.0 920.0 215.0 940 215.0" stroke="#2A3142" stroke-width="1.5"/><path d="M900 150.0 C920.0 150.0 920.0 215.0 940 215.0" stroke="#D4FF3A" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="3 9" class="flow"/><circle r="3.5" fill="#D4FF3A"><animateMotion dur="2.4s" begin="0s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#e1"/></animateMotion></circle><path id="e2" d="M900 280.0 C920.0 280.0 920.0 215.0 940 215.0" stroke="#2A3142" stroke-width="1.5"/><path d="M900 280.0 C920.0 280.0 920.0 215.0 940 215.0" stroke="#D4FF3A" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="3 9" class="flow"/><circle r="3.5" fill="#D4FF3A"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#e2"/></animateMotion></circle><path id="e3" d="M1058 215.0 C1075.0 215.0 1075.0 130.0 1092 130.0" stroke="#2A3142" stroke-width="1.5"/><path d="M1058 215.0 C1075.0 215.0 1075.0 130.0 1092 130.0" stroke="#D4FF3A" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="3 9" class="flow"/><circle r="3.5" fill="#D4FF3A"><animateMotion dur="2.0s" begin="0.4s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#e3"/></animateMotion></circle><path id="e4" d="M1058 215.0 C1075.0 215.0 1075.0 215.0 1092 215.0" stroke="#2A3142" stroke-width="1.5"/><path d="M1058 215.0 C1075.0 215.0 1075.0 215.0 1092 215.0" stroke="#D4FF3A" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="3 9" class="flow"/><circle r="3.5" fill="#D4FF3A"><animateMotion dur="2.0s" begin="1.0s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#e4"/></animateMotion></circle><path id="e5" d="M1058 215.0 C1075.0 215.0 1075.0 300.0 1092 300.0" stroke="#2A3142" stroke-width="1.5"/><path d="M1058 215.0 C1075.0 215.0 1075.0 300.0 1092 300.0" stroke="#D4FF3A" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="3 9" class="flow"/><circle r="3.5" fill="#D4FF3A"><animateMotion dur="2.0s" begin="1.6s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#e5"/></animateMotion></circle><rect x="760" y="128" width="140" height="44" rx="10" fill="#10131A" stroke="#2A3142"/><text class="mono" x="830.0" y="155" text-anchor="middle" font-size="13" fill="#C9CEDA">next.js · web</text><rect x="760" y="258" width="140" height="44" rx="10" fill="#10131A" stroke="#2A3142"/><text class="mono" x="830.0" y="285" text-anchor="middle" font-size="13" fill="#C9CEDA">react native</text><rect x="940" y="193" width="118" height="44" rx="10" fill="#141A0B" stroke="#D4FF3A"/><text class="mono" x="999.0" y="220" text-anchor="middle" font-size="13" fill="#D4FF3A">nestjs api</text><rect x="1092" y="108" width="86" height="44" rx="10" fill="#10131A" stroke="#2A3142"/><text class="mono" x="1135.0" y="135" text-anchor="middle" font-size="13" fill="#C9CEDA">postgres</text><rect x="1092" y="193" width="86" height="44" rx="10" fill="#10131A" stroke="#2A3142"/><text class="mono" x="1135.0" y="220" text-anchor="middle" font-size="13" fill="#C9CEDA">mongodb</text><rect x="1092" y="278" width="86" height="44" rx="10" fill="#10131A" stroke="#2A3142"/><text class="mono" x="1135.0" y="305" text-anchor="middle" font-size="13" fill="#C9CEDA">redis</text><path id="e6" d="M999 237 V292" stroke="#2A3142" stroke-width="1.5"/><path d="M999 237 V292" stroke="#5EEAD4" stroke-opacity=".7" stroke-width="1.5" stroke-dasharray="3 7" class="flow"/><circle r="3.5" fill="#5EEAD4"><animateMotion dur="1.6s" repeatCount="indefinite"><mpath href="#e6"/></animateMotion></circle><rect x="928" y="292" width="142" height="44" rx="10" fill="#0B1A19" stroke="#5EEAD4"/><text class="mono" x="999.0" y="319" text-anchor="middle" font-size="13" fill="#5EEAD4">✦ ai · llm agents</text>
  </g>

</g>
<rect x="0.5" y="0.5" width="1199" height="469" rx="19.5" stroke="#1C2130"/>
</svg>