<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" fill="none">
<style>
  .sans { font-family: 'Inter Display','Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; }
  .mono { font-family: 'JetBrains Mono','SF Mono','Cascadia Code',Consolas,'DejaVu Sans Mono',Menlo,monospace; }
  .rise { opacity:0; animation: rise .8s cubic-bezier(.2,.7,.2,1) forwards; }
  @keyframes rise { from { opacity:0; transform:translateY(10px) } to { opacity:1; transform:none } }
</style>
<defs>
