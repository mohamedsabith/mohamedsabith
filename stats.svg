  <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#D4FF3A" stop-opacity=".14"/><stop offset="1" stop-color="#D4FF3A" stop-opacity="0"/></radialGradient>
  <clipPath id="card"><rect width="1200" height="340" rx="20"/></clipPath>
</defs>
